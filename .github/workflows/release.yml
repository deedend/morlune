name: release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag and version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Run this workflow from a version tag, not a branch.' >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          grep -Fq "versionName = \"$VERSION\"" app/build.gradle.kts || {
            echo "Gradle versionName does not match $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Engine tests
        run: ./gradlew :engine:runTests

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MORLUNE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MORLUNE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MORLUNE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MORLUNE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && \
            test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
              echo 'Configure all four signing secrets before publishing.' >&2
              exit 1
            }

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MORLUNE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morlune-release.jks"

      - name: Build signed release APK
        env:
          MORLUNE_KEYSTORE_PATH: ${{ runner.temp }}/morlune-release.jks
          MORLUNE_KEYSTORE_PASSWORD: ${{ secrets.MORLUNE_KEYSTORE_PASSWORD }}
          MORLUNE_KEY_ALIAS: ${{ secrets.MORLUNE_KEY_ALIAS }}
          MORLUNE_KEY_PASSWORD: ${{ secrets.MORLUNE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/morlune.apk
          (cd dist && sha256sum morlune.apk > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/morlune.apk dist/SHA256SUMS.txt \
            --verify-tag --title "Morlune $GITHUB_REF_NAME" \
            --notes "Signed Android release APK. F-Droid will provide separately signed builds."
